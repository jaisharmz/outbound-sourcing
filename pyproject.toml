[project]
name = "outbound-sourcing"
version = "0.1.0"
description = "Agentic prospect discovery with a deterministic send path."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.1",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "dnspython>=2.6",
]

# The CLI's own guidance says "Run: outbound test-email ...". That string is
# printed by gates and error paths, so it needs to be a real command rather than
# shorthand for `python -m scripts.outbound`.
[project.scripts]
outbound = "scripts.outbound:app"

[project.optional-dependencies]
gmail = [
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "google-auth>=2.29",
]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
