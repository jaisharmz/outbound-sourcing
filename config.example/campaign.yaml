name: default

# Every test send goes here. Fire one at yourself before anything touches a
# stranger -- the scheduler refuses to send from a mailbox that has not passed.
test_recipient: you@example.com

# --to is the only path that reaches an address the review gate never saw.
# Anything not listed here (or test_recipient) needs --force. Suppression is
# checked regardless and --force does not override it.
test_send_allowlist:
  - you@example.com
  - "*@mail-tester.com"

timezone: America/Los_Angeles

# Safety rail on a manually invoked send, not a scheduler budget.
daily_cap: 25

sending_window:
  days: [tue, wed, thu]
  start: "08:00"
  end: "16:00"

inter_send_delay:
  distribution: uniform
  min_seconds: 90
  max_seconds: 420

verification:
  enabled: true
  # MX lookup then an SMTP RCPT probe. Most Workspace and M365 domains are
  # accept-all, so catch_all is the expected outcome and sends normally.
  chain: [mx, smtp]
  smtp_timeout_seconds: 10
  smtp_probe_from: probe@example.com

discovery:
  subagent_tool_budget: 15
  companies_per_batch: 5
  cache_dir: state/cache
  candidates_dir: state/candidates

attachments_root: /path/to/your/attachments

# Wire bytes, after base64, which is what a receiving gateway measures.
# Gateway rejection is independent of send volume, so both gates stay.
max_attachment_bytes: 5000000
campaign_max_attachment_bytes: 5000000
