steps:
  - id: step1_initial
    template: step1_initial.md
    delay_business_days: 0
    jitter_business_days: 0
    attachment_set: first_touch

  - id: step2_bump
    template: step2_bump.md
    delay_business_days: 4
    jitter_business_days: 1

  - id: step3_breakup
    template: step3_breakup.md
    delay_business_days: 7
    jitter_business_days: 1

# Each document may have a local file, a URL, or both. Attaching wins where the
# file fits under campaign.yaml: max_attachment_bytes; anything that does not
# fit is linked instead. The split is computed from real sizes, not declared.
attachment_sets:
  first_touch:
    dir: _first_email
    documents:
      - name: Example small document
        file: example_document_a.pdf
        url: https://example.com/a.pdf
      - name: Example large document
        file: example_document_b.pdf
        url: https://example.com/b.pdf

reply_templates:
  interested: reply_interested.md
