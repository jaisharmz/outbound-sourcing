# Fund portfolios. Each entry declares one URL and how to read that page.
#
# Two funds already need two strategies, so this is per-fund by design:
#
#   embedded_json     the roster is a JSON array inside a data- attribute.
#                     One request, complete list. Invisible to markdown
#                     conversion -- see the required check in
#                     references/discovery.md.
#   list_plus_detail  the index links to per-company pages carrying the real
#                     domain and founders. 1 + N requests.

funds:
  a16z:
    url: https://a16z.com/portfolio/
    strategy: embedded_json
    attribute: data-companies
    name_field: name
    url_field: company_url
    description_field: website_description
    founders_field: founders_list
    # Notes only, never filters: a16z lists Cursor's stage as M&A, which is
    # wrong, and `verticals` is their internal taxonomy rather than a segment.
    stages_field: stages
    verticals_field: focus_areas
    status_field: status
    status_contains: Active

  lux:
    url: https://www.luxcapital.com/companies
    strategy: list_plus_detail
    link_pattern: 'href="(/companies/[^"#?]+)"'
    skip_hosts:
      - luxcapital.com
      - linkedin.com
      - twitter.com
      - x.com
      - facebook.com
      - instagram.com
      - youtube.com

  # ---- verified parseable, full data --------------------------------------
  index:
    url: https://www.indexventures.com/companies/
    strategy: list_plus_detail
    link_pattern: 'href="(/companies/[^"#?]+)"'
    skip_hosts: [indexventures.com, notoptional.eu, linkedin.com, twitter.com, x.com]

  greylock:
    url: https://greylock.com/portfolio/
    strategy: list_plus_detail
    link_pattern: 'href="(/portfolio/[^"#?]+)"'
    skip_hosts: [greylock.com, googletagmanager.com, linkedin.com, twitter.com, x.com]

  # ---- names only ---------------------------------------------------------
  # Sitemaps list every company page, but the pages themselves are
  # client-rendered: no description and no company URL survive a fetch. Useful
  # as a name source to hand to research, not as an enrichment source.
  kleiner-perkins:
    url: https://www.kleinerperkins.com/company-sitemap.xml
    strategy: sitemap_names
    path_contains: /company/
    # Warm-intro route exists here; treat separately from cold outreach.
    relationship: fellowship

  general-catalyst:
    url: https://www.generalcatalyst.com/sitemap.xml
    strategy: sitemap_names
    path_contains: /companies/

  # ---- not parseable ------------------------------------------------------
  # Probed and recorded rather than guessed at. Each renders its roster
  # client-side with nothing recoverable from the HTML, and no sitemap that
  # separates companies from other pages.
  #   khosla     97KB, 1 internal link
  #   sequoia    408KB, 0 company links
  #   benchmark  2KB behind a wall
  #   lux        29 links, capped near 30 without a browser
