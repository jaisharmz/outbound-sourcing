# One mailbox. Cold sends go From the sending address with Reply-To wherever you
# actually read mail, which keeps a second address visible without routing
# volume through it.

mailboxes:
  - id: primary
    provider: smtp
    from:
      name: Your Name
      address: you@example.com
    reply_to: you@your-institution.edu
    auth_ref: SMTP_APP_PASSWORD      # key into secrets.env
    smtp_host: smtp.gmail.com
    smtp_port: 587
    imap_host: imap.gmail.com
    imap_port: 993
    enabled: true

  - id: console
    provider: console
    from:
      name: Your Name
      address: you@example.com
    enabled: false
