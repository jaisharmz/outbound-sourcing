# Who counts as a target. Applied deterministically at ingest -- no judgment,
# no model. A candidate that fails any rule here never reaches the queue.

titles:
  - research scientist
  - research engineer
  - member of technical staff
  - machine learning engineer
  - principal engineer
  - staff engineer
  - head of ai
  - head of ml
  - founder
  - co-founder
  - cto
title_excludes:
  - recruiter
  - talent
  - sales
  - account executive
  - intern
seniority: [senior, staff, principal, lead, head, director, founder]

company_size:
  min: 2
  max: 5000

include_regions: [US, CA]
# GDPR legitimate-interest for cold B2B is a call to make deliberately.
# Remove entries here only when you have decided to make it.
exclude_regions: [EU, UK, EEA, CH]

exclude_domains:
  - example.com
exclude_companies:
  - Example Excluded Co

# Applied to the reason a source run gave for setting a company aside. Anything
# matched here is dropped as never-a-target; everything else goes to triage.
# These are deliberately narrow -- a false positive silently loses a viable
# company, a false negative just means one more row to sort by hand.
auto_drop_reason_patterns:
  # advocacy, policy and grantmaking organisations rather than research
  - advocacy and grantmaking
  - advocacy for an enforced
  - policy critique
  - not technical safety work
  - near-term deployment harms
  - explicitly not a frontier-risk
  - moral status and model welfare
  # infrastructure landlords rather than AI companies
  - real estate and megawatts
  - powered shells
  # nothing findable to write to
  - I found no product
  - no listed team
  - solely as an affiliation string

# Traversal surfaces a research group together, and four people from one
# lab will compare notes with each other.
max_contacts_per_lab: 2
max_contacts_per_company: 3
# Not lowered. Below this an inferred address is a guess at a domain with no
# convention, and names diverge from addresses even where a pattern looks clean
# -- Skydio's Matias Varnum commits as matias.christensen@. Twelve good emails
# beat forty with bounces.
min_confidence: 0.5
